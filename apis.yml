aid: 18birdies
name: 18Birdies
description: >-
  18Birdies is a golf technology company behind the 18Birdies mobile app — a golf GPS
  rangefinder, digital scorecard, shot- and stat-tracking platform and social network for
  golfers, founded in 2014. The app combines Google Maps-derived course imagery and elevation
  with hole-by-hole GPS distances, 3D green maps, wind and slope adjustment, club
  recommendations, strokes-gained analytics, an AI Swing Analyzer, handicap tracking, side
  games and tournament/league management across a worldwide golf course database. It operates
  a freemium consumer subscription (a free tier plus Premium) with companion Apple Watch and
  Wear OS experiences. 18Birdies runs a production backend at api.18birdies.com that serves
  its own mobile clients, but as of this profiling pass it publishes no public developer
  program, no API reference, and no machine-readable contract.
